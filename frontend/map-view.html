<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Incidentkaart</title><style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1217;font-family:Arial,Helvetica,sans-serif}
#map{position:relative;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}
.tile{position:absolute;width:256px;height:256px;object-fit:cover;user-select:none;-webkit-user-drag:none;filter:grayscale(.38) saturate(.62) brightness(.68) contrast(1.12)}
.shade{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 105px rgba(0,0,0,.58);background:linear-gradient(180deg,rgba(4,11,15,.10),rgba(4,11,15,.24))}
.route-guide{position:absolute;inset:0;width:100%;height:100%;z-index:14;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}.route-guide line{stroke:rgba(105,217,255,.78);stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round}.route-guide .route-path{fill:none;stroke:rgba(105,217,255,.96);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.route-guide[hidden]{display:none}
.marker{position:absolute;width:27px;height:27px;transform:translate(-50%,-100%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.72));z-index:20}
.marker:before{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff4338;border:3px solid rgba(255,255,255,.96);box-sizing:border-box}
.marker:after{content:"";position:absolute;left:9px;top:9px;width:6px;height:6px;border-radius:50%;background:#fff}
.origin,.post-marker{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border:4px solid rgba(235,250,255,.96);border-radius:50%;background:#21a9db;box-shadow:0 5px 14px rgba(0,0,0,.72);z-index:20}.origin[hidden]{display:none}.post-marker{border:3px solid rgba(255,255,255,.92);border-radius:50%;background:#f2b632;box-shadow:0 4px 12px rgba(0,0,0,.65);z-index:19}.map-label.post-label{color:#fff0b5;transform:translate(-50%,8px)}
.map-label{position:absolute;z-index:22;max-width:48%;transform:translate(-50%,8px);padding:4px 7px;border-radius:7px;background:rgba(4,12,17,.82);color:#e8f7fc;font:700 10px/1.2 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px rgba(0,0,0,.45)}.map-label.incident{transform:translate(-50%,8px);color:#ffd9d5}.map-label[hidden]{display:none}
.pulse{position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);border:2px solid rgba(255,59,48,.72);border-radius:50%;animation:pulse 1.8s ease-out infinite;z-index:18}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.coord{position:absolute;left:9px;bottom:8px;z-index:25;padding:5px 7px;border-radius:7px;background:rgba(4,10,14,.72);color:rgba(230,244,250,.82);font:600 10px/1.2 Arial,sans-serif;letter-spacing:.02em}
.attr{position:absolute;right:7px;bottom:7px;z-index:25;padding:4px 6px;border-radius:5px;background:rgba(255,255,255,.82);color:#222;font:10px/1.2 Arial,sans-serif}.attr a{color:#174a76;text-decoration:none}
.offline{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);max-width:80%;text-align:center;color:rgba(214,232,240,.66);font:700 14px/1.35 Arial,sans-serif}.offline small{display:block;margin-top:5px;font-weight:500;opacity:.8}
</style></head><body><div id="map"><div class="offline" id="offline">PDOK-kaart laden…<small>Officiële Nederlandse straatnamen en kaartdata.</small></div><svg id="routeGuide" class="route-guide" hidden aria-hidden="true"><polyline id="routePath" class="route-path" points=""></polyline><line id="routeLine" x1="0" y1="0" x2="0" y2="0"></line></svg><div class="shade"></div><div class="pulse" id="incidentPulse"></div><div class="marker" id="incidentMarker"></div><div class="map-label incident" id="incidentLabel">Incident</div><div class="origin" id="originMarker" hidden></div><div class="map-label" id="originLabel" hidden>Standplaats</div><div class="coord" id="coord"></div><div class="attr">Kaartgegevens © <a href="https://www.kadaster.nl" target="_blank" rel="noopener">Kadaster / PDOK</a></div></div>
<script>
'use strict';
const q=new URLSearchParams(location.search),lat=Math.max(-85,Math.min(85,Number(q.get('lat'))||52.252)),lon=Math.max(-180,Math.min(180,Number(q.get('lon'))||5.26)),requestedZoom=Math.max(7,Math.min(18,Math.round(Number(q.get('zoom'))||16)));
const originLatRaw=Number(q.get('originLat')),originLonRaw=Number(q.get('originLon')),hasOrigin=Number.isFinite(originLatRaw)&&Number.isFinite(originLonRaw)&&Math.abs(originLatRaw)<=85&&Math.abs(originLonRaw)<=180&&(Math.abs(originLatRaw-lat)>.00005||Math.abs(originLonRaw-lon)>.00005),originLat=hasOrigin?originLatRaw:lat,originLon=hasOrigin?originLonRaw:lon,originName=String(q.get('originLabel')||'Standplaats').slice(0,80);
const routeEncoded=String(q.get('routePolyline')||'');let posts=[];try{const raw=JSON.parse(q.get('posts')||'[]');if(Array.isArray(raw))posts=raw.filter(x=>Number.isFinite(Number(x?.lat))&&Number.isFinite(Number(x?.lon))).slice(0,8).map(x=>({lat:Number(x.lat),lon:Number(x.lon),name:String(x.name||'Post').slice(0,60)}))}catch{}
const map=document.getElementById('map'),offline=document.getElementById('offline'),coord=document.getElementById('coord'),incidentMarker=document.getElementById('incidentMarker'),incidentPulse=document.getElementById('incidentPulse'),incidentLabel=document.getElementById('incidentLabel'),originMarker=document.getElementById('originMarker'),originLabel=document.getElementById('originLabel'),routeGuide=document.getElementById('routeGuide'),routeLine=document.getElementById('routeLine'),routePath=document.getElementById('routePath');coord.textContent=hasOrigin?'Standplaats  →  incident':`${lat.toFixed(5)}, ${lon.toFixed(5)} • z${requestedZoom}`;
function decodePolyline(value){const pts=[];let i=0,plat=0,plon=0;try{while(i<value.length){let shift=0,result=0,b;do{b=value.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32&&i<=value.length);plat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{b=value.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32&&i<=value.length);plon+=(result&1)?~(result>>1):(result>>1);pts.push({lat:plat/1e5,lon:plon/1e5})}}catch{return []}return pts.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&Math.abs(p.lat)<=85&&Math.abs(p.lon)<=180)}
const routePoints=routeEncoded?decodePolyline(routeEncoded):[];
let tiles=[];
function mercator(lat,lon,z){const n=2**z,x=(lon+180)/360*n,r=lat*Math.PI/180,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;return{x,y,n}}
function inverseMercator(x,y,z){const n=2**z,lon=x/n*360-180,rad=Math.atan(Math.sinh(Math.PI*(1-2*y/n)));return{lat:rad*180/Math.PI,lon}}
function viewForSize(w,h){if(!hasOrigin&&!posts.length)return{lat,lon,zoom:requestedZoom};const fitPoints=(routePoints.length>1?routePoints.concat([{lat,lon},{lat:originLat,lon:originLon}]):[{lat,lon},...(hasOrigin?[{lat:originLat,lon:originLon}]:[])]).concat(posts);for(let z=Math.min(requestedZoom,16);z>=7;z--){const projected=fitPoints.map(p=>mercator(p.lat,p.lon,z)),xs=projected.map(p=>p.x),ys=projected.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),dx=(maxX-minX)*256,dy=(maxY-minY)*256;if(dx<=Math.max(80,w-110)&&dy<=Math.max(80,h-125)){const mid=inverseMercator((minX+maxX)/2,(minY+maxY)/2,z);return{...mid,zoom:z}}}const all=[{lat,lon},...(hasOrigin?[{lat:originLat,lon:originLon}]:[]),...posts];return{lat:all.reduce((a,p)=>a+p.lat,0)/all.length,lon:all.reduce((a,p)=>a+p.lon,0)/all.length,zoom:7}}
function screenPoint(pointLat,pointLon,center,z,w,h){const p=mercator(pointLat,pointLon,z),c=mercator(center.lat,center.lon,z);return{x:w/2+(p.x-c.x)*256,y:h/2+(p.y-c.y)*256}}
function place(el,p){el.style.left=`${Math.round(p.x)}px`;el.style.top=`${Math.round(p.y)}px`}
function clearTiles(){for(const t of tiles)t.remove();tiles=[]}
function render(){clearTiles();const w=innerWidth,h=innerHeight,view=viewForSize(w,h),zoom=view.zoom,c=mercator(view.lat,view.lon,zoom),rx=Math.ceil(w/512)+1,ry=Math.ceil(h/512)+1,cx=Math.floor(c.x),cy=Math.floor(c.y);let loaded=0,failed=0,total=0;
  const incidentPoint=screenPoint(lat,lon,view,zoom,w,h);place(incidentMarker,incidentPoint);place(incidentPulse,incidentPoint);place(incidentLabel,incidentPoint);
  if(hasOrigin){const originPoint=screenPoint(originLat,originLon,view,zoom,w,h);originMarker.hidden=false;originLabel.hidden=false;routeGuide.hidden=false;originLabel.textContent=originName;place(originMarker,originPoint);place(originLabel,originPoint);if(routePoints.length>1){routePath.style.display='';routeLine.style.display='none';routePath.setAttribute('points',routePoints.map(p=>{const sp=screenPoint(p.lat,p.lon,view,zoom,w,h);return `${sp.x.toFixed(1)},${sp.y.toFixed(1)}`}).join(' '))}else{routePath.style.display='none';routeLine.style.display='';routeLine.setAttribute('x1',originPoint.x);routeLine.setAttribute('y1',originPoint.y);routeLine.setAttribute('x2',incidentPoint.x);routeLine.setAttribute('y2',incidentPoint.y)}}else{originMarker.hidden=true;originLabel.hidden=true;routeGuide.hidden=true}
  map.querySelectorAll('.post-marker,.post-label').forEach(x=>x.remove());for(const post of posts){const pp=screenPoint(post.lat,post.lon,view,zoom,w,h),mk=document.createElement('div'),lb=document.createElement('div');mk.className='post-marker';lb.className='map-label post-label';lb.textContent=post.name;place(mk,pp);place(lb,pp);map.append(mk,lb)}
  for(let ty=cy-ry;ty<=cy+ry;ty++){if(ty<0||ty>=c.n)continue;for(let tx=cx-rx;tx<=cx+rx;tx++){total++;const wx=((tx%c.n)+c.n)%c.n,img=new Image();img.className='tile';img.alt='';img.referrerPolicy='no-referrer';img.decoding='async';img.style.left=`${Math.round(w/2+(tx-c.x)*256)}px`;img.style.top=`${Math.round(h/2+(ty-c.y)*256)}px`;img.onload=()=>{loaded++;if(loaded>0)offline.style.display='none'};img.onerror=()=>{
      if(img.dataset.fallback!=='osm'){img.dataset.fallback='osm';img.src=`https://tile.openstreetmap.org/${zoom}/${wx}/${ty}.png`;return;}
      failed++;img.remove();if(failed>=total&&loaded===0){offline.innerHTML='Kaarttegels tijdelijk niet bereikbaar<small>Locatie is wel gevonden; marker staat op de juiste coördinaten.</small>'}
    };
    img.dataset.fallback='pdok';
    img.src=`https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/${zoom}/${wx}/${ty}.png`;
    map.insertBefore(img,map.firstChild);tiles.push(img)}}
}
addEventListener('resize',()=>requestAnimationFrame(render));render();
</script></body></html>
