name: Lichtkrant controles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Integriteit van het gepubliceerde pakket
        run: python tools/check_manifest.py
      - name: Backend, HTTP en updatepakket
        run: python tools/run_tests.py
      - name: Bedienpaneel en schermprotocol
        run: npm test
      - name: JavaScript syntaxis
        run: python tools/check_javascript.py
      - name: Browser installeren
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/p2000-browser" --no-package-lock --ignore-scripts playwright@1.51.1
          "$RUNNER_TEMP/p2000-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobiele vormgeving en tv in Chromium
        if: runner.os == 'Linux'
        env:
          NODE_PATH: ${{ runner.temp }}/p2000-browser/node_modules
        run: node tests/browser-smoke.cjs
      - name: Schermbeelden bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-previews
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore
